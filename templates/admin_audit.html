{% extends "base.html" %}
{% block title %}Audit logs{% endblock %}
{% block content %}
<div class="card">
  <h3>Audit log</h3>
  <table>
    <tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>IP address</th></tr>
    {% for l in logs %}
    <tr><td>{{ l.t }}</td><td>{{ l.actor }}</td><td>{{ l.action }}</td><td>{{ l.target }}</td><td>{{ l.ip_address }}</td></tr>
    {% else %}<tr><td colspan="5">Nothing logged yet.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
