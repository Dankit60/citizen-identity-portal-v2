services:
  - type: web
    name: citizen-identity-portal-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PORTAL_DEMO_UPLOAD
        value: "1"
